name: CI

# 跨语言/端到端测试依赖各语言工具链，因此按平台拆分：
#   linux   : Rust 单测 + 跨语言等价性 + Web 契约（不需要 C++/OpenCV）
#   wasm    : 从源码重建 wasm，验证浏览器端产物可复现
#   windows : 用 MSYS2 的 OpenCV 编译 C++ 端，跑端到端（C++ 目前仍依赖 windows.h/psapi）
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Rust 单测 + 跨语言 + Web 契约（Linux）
    runs-on: ubuntu-latest
    env:
      PY_EXE: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Python 依赖
        run: python -m pip install --quiet --upgrade pip numpy pillow

      - name: Rust 核心单元测试
        working-directory: web/rs
        run: cargo test --release

      - name: 跨语言等价性（Node 参考 / Rust-WASM / Python）
        run: node tests/cross_language.test.mjs

      - name: Web 端契约 + 真实尺寸 worker 往返
        run: node tests/web_ui.test.mjs

      - name: 推送前体积检查（不该存在待上传的大对象）
        run: node tests/remote_bloat_check.mjs --min=4194304 --top=10

  wasm:
    name: 从源码重建 WASM 并校验可复现（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不加 targets：工具链版本由 web/rs/rust-toolchain.toml 固定（含 wasm32 target），
      # 这是"产物字节可复现"的前提——不同 rustc 编出的 wasm 字节并不相同。
      - uses: dtolnay/rust-toolchain@stable

      - name: 显示工具链版本
        working-directory: web/rs
        run: cargo --version && rustc --version

      - name: 安装 wasm-bindgen-cli（版本必须与 Cargo.toml 完全一致）
        run: |
          set -euo pipefail
          version=$(grep -oP 'wasm-bindgen = "=\K[0-9.]+' web/rs/Cargo.toml)
          echo "Cargo.toml 要求 wasm-bindgen $version"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: 编译 wasm
        working-directory: web/rs
        run: cargo build --release --target wasm32-unknown-unknown

      - name: wasm-bindgen 生成 JS 胶水
        working-directory: web/rs
        run: |
          wasm-bindgen --target web --reference-types \
            --out-dir target/bindgen --out-name lp_crypt_wasm_core \
            target/wasm32-unknown-unknown/release/lp_crypt_wasm_core.wasm

      - name: 行为比对（新构建 vs 仓库内产物 vs v2-alpha 旧 blob）
        run: node tests/wasm_parity.mjs

      - name: 仓库内产物应与源码构建结果一致（防止改了 lib.rs 忘记重新构建）
        run: |
          set -euo pipefail
          fail=0
          for name in lp_crypt_wasm_core.js lp_crypt_wasm_core_bg.wasm; do
            built="web/rs/target/bindgen/$name"
            committed="web/src/wasm/$name"
            want=$(sha256sum "$built" | cut -d' ' -f1)
            got=$(sha256sum "$committed" | cut -d' ' -f1)
            if [ "$want" = "$got" ]; then
              echo "OK   $name 与源码构建结果一致 ($want)"
            else
              echo "::error file=$committed::$name 与源码构建结果不一致，请运行 web/rs/build.ps1 并提交产物"
              echo "     期望 $want"
              echo "     实际 $got"
              fail=1
            fi
          done
          exit $fail

  windows:
    name: C++ 端到端（Windows + MSYS2 OpenCV）
    runs-on: windows-latest
    env:
      PY_EXE: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Python 依赖
        run: python -m pip install --quiet --upgrade pip numpy pillow opencv-python-headless

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-opencv

      - name: 编译 C++ 命令行版
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p Cpp/bin
          g++ -std=c++20 -O2 -Wall -Wextra \
            -I/mingw64/include/opencv4 \
            Cpp/hilbert_encrypt.cpp \
            -o Cpp/bin/hilbert_encrypt.exe \
            -L/mingw64/lib \
            -lopencv_core -lopencv_imgproc -lopencv_imgcodecs -lpsapi

      - name: 复制运行时依赖（自动解析导入表，含间接依赖）
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # 与 Cpp/build.ps1 同样的思路：用 objdump 解析导入表算依赖闭包。
          # 手工维护 DLL 清单会漏掉 OpenCV 的间接依赖（zlib/lzma/zstd 等）。
          cd Cpp/bin
          system='^(api-ms-|ext-ms-|KERNEL|USER32|ADVAPI|SHELL32|GDI32|OLE32|OLEAUT|COMDLG|WS2_|WSOCK|VCRUNTIME|ucrtbase|MSVCP|ntdll|bcrypt|CRYPT32|PSAPI|WINMM|VERSION|IMM32|SHLWAPI|mpr|dbghelp|POWRPROF|DWMAPI|UxTheme|d3d|DXGI|opengl|setupapi|CFGMGR32|RPCRT4|secur32|normaliz|WLDAP32|urlmon|wininet|IPHLPAPI|DNSAPI|NETAPI32|USERENV|PROFAPI|AUTHZ|SSPICLI|schannel|ncrypt|WINTRUST|imagehlp)'
          queue=(hilbert_encrypt.exe)
          while [ ${#queue[@]} -gt 0 ]; do
            file="${queue[0]}"; queue=("${queue[@]:1}")
            for dll in $(objdump -p "$file" 2>/dev/null | awk '/DLL Name:/{print $3}'); do
              [[ "$dll" =~ $system ]] && continue
              [ -f "$dll" ] && continue
              if [ -f "/mingw64/bin/$dll" ]; then
                cp "/mingw64/bin/$dll" .
                queue+=("$dll")
              fi
            done
          done
          echo "bin 目录现有 $(ls -1 *.dll | wc -l) 个 DLL"

      - name: 预检（先确认产物真的能在这个 runner 上启动）
        shell: pwsh
        env:
          PATH: C:\msys64\mingw64\bin;${{ env.PATH }}
        run: |
          Write-Host "bin 内容:"
          Get-ChildItem Cpp\bin | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          $out = & .\Cpp\bin\hilbert_encrypt.exe -h 2>&1 | Out-String
          Write-Host "退出码: $LASTEXITCODE"
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "C++ 产物无法启动（退出码 $LASTEXITCODE），很可能是缺 DLL" }

      - name: 端到端 CLI（C++ 与 Python 产物互通）
        env:
          # Node 起的子进程不带 MSYS2 的 PATH，把 mingw64/bin 加进去，确保 exe 能找到依赖
          PATH: C:\msys64\mingw64\bin;${{ env.PATH }}
        run: node tests/e2e_cli.test.mjs

      - name: Rust 单测 + 跨语言 + Web 契约
        run: node tests/run_all.mjs --quick
